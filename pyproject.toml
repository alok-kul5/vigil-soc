[project]
name = "security-alert-triage-agent"
version = "1.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Scenario data and tool descriptions read better as long lines; unused names document the story.
"triage_agent/dataset/generate.py" = ["E501", "F841", "B007"]
"triage_agent/tools.py" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["triage_agent", "tests"]
