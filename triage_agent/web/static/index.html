<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigil · Alert triage</title>
  <link rel="icon" href="/static/mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..700&family=Red+Hat+Mono:wght@400..600&family=Unbounded:wght@500..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <div class="brand"><img class="mark" src="/static/mark.svg" alt="" width="22" height="22">Vigil <span class="muted">· local AI, human-approved</span></div>
    <div class="right">
      <label class="approver">Approving as <input id="approver" placeholder="your name" autocomplete="name"></label>
      <span id="health" class="pill">…</span>
    </div>
  </header>

  <div class="layout">
    <aside class="queue" aria-label="Alert queue">
      <div class="queue-head">
        <div class="queue-title">Alert queue <span id="queue-count" class="muted"></span><span class="keys" aria-hidden="true"><kbd>j</kbd><kbd>k</kbd></span></div>
        <div class="filters" id="filters" role="group" aria-label="Filter alerts">
          <button class="on" data-f="all">All</button><button data-f="critical">Critical</button><button data-f="high">High</button><button data-f="medium">Medium</button><button data-f="low">Low</button><button data-f="pending">Needs approval</button>
        </div>
      </div>
      <ul id="queue"></ul>
    </aside>

    <main id="detail" class="detail">
      <div class="empty">Select an alert to investigate.</div>
    </main>
  </div>

  <dialog id="evidence">
    <form method="dialog"><button class="close" aria-label="Close">×</button></form>
    <h3 id="evidence-title"></h3>
    <pre id="evidence-body"></pre>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
